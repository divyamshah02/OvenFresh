<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Order - ShopAdmin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/static/css/admin/styles.css">
</head>
<body class="ovenfresh-theme">
  <div class="container-fluid">
    <div class="row">
      {% include 'admin/admin-nav.html' %}

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Add New Order</h1>
        </div>

        <!-- Order Form -->
        <form id="adminAddOrderForm" class="mb-5">
          <div class="row">
            <!-- Customer Details -->
            <div class="col-lg-6 mb-4">
              <div class="card">
                <div class="card-header"><h5 class="mb-0">Customer Details</h5></div>
                <div class="card-body">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">First Name *</label>
                      <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Last Name *</label>
                      <input type="text" class="form-control" id="lastName" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email *</label>
                      <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Phone *</label>
                      <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Address *</label>
                      <input type="text" class="form-control" id="address" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">City *</label>
                      <input type="text" class="form-control" id="city" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Pincode *</label>
                      <input type="text" class="form-control" id="pincode" required>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Delivery & Payment -->
            <div class="col-lg-6 mb-4">
              <div class="card mb-3">
                <div class="card-header"><h5 class="mb-0">Delivery</h5></div>
                <div class="card-body">
                  <div class="mb-3">
                    <label class="form-label">Order Date *</label>
                    <input type="text" id="orderDate" class="form-control" required>
                  </div>
                    <div class="mb-3">
                    <label class="form-label">Delivery Date *</label>
                    <input type="text" id="deliveryDate" class="form-control" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Timeslot *</label>
                    <select id="timeslotSelect" class="form-select" required>
                      <option value="">Select Timeslot</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><h5 class="mb-0">Payment</h5></div>
                <div class="card-body">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="cod" value="cod" checked>
                    <label class="form-check-label" for="cod">Cash on Delivery</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="razorpay" value="razorpay">
                    <label class="form-check-label" for="razorpay">Online (Razorpay)</label>
                  </div>
                  <div class="mt-3">
                    <label class="form-label">Coupon Code</label>
                    <div class="input-group">
                      <input type="text" class="form-control" id="couponCode">
                      <button class="btn btn-outline-secondary" type="button" id="applyCouponBtn">Apply</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Product Selection -->
          <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0">Select Products</h5></div>
            <div class="card-body">
              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label class="form-label">Category</label>
                  <select id="categorySelect" class="form-select">
                    <option value="">All Categories</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Subcategory</label>
                  <select id="subcategorySelect" class="form-select">
                    <option value="">All Subcategories</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Product</label>
                  <select id="productSelect" class="form-select">
                    <option value="">Select Product</option>
                  </select>
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label">Variation</label>
                  <select id="variationSelect" class="form-select">
                    <option value="">Select Variation</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Quantity</label>
                  <input type="number" id="productQty" class="form-control" min="1" value="1">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                  <button type="button" class="btn btn-primary w-100" id="addProductBtn"><i class="fas fa-plus"></i> Add</button>
                </div>
              </div>

              <!-- Cart Preview -->
              <div class="table-responsive">
                <table class="table table-bordered align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>Product</th>
                      <th>Variation</th>
                      <th>Qty</th>
                      <th>Price</th>
                      <th>Total</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="orderItemsTableBody"></tbody>
                </table>
              </div>

              <!-- Totals -->
              <div class="text-end">
                <p class="mb-1">Subtotal: ₹<span id="subtotal">0</span></p>
                <p class="mb-1">Tax (18%): ₹<span id="taxAmount">0</span></p>
                <p class="mb-1">Delivery: ₹<span id="deliveryCharge">0</span></p>
                <p class="mb-1">Discount: ₹<span id="discountAmount">0</span></p>
                <h5>Total: ₹<span id="grandTotal">0</span></h5>
              </div>
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">Place Order</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/scripts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="/static/js/admin/admin_add_order.js"></script>

  <script>
    AdminAddOrder(
    "{{ csrf_token }}",
    "/product-api/admin-product-tax-rates-api/",
    "/product-api/timeslot/",
    "/order-api/admin-place-order-api/",
    "/order-api/coupon-validate-api/"
    )
    </script>
</body>
</html>
