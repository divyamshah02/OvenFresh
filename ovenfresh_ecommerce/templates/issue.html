<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Temporarily Unavailable</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border: none;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 15px;
      max-width: 500px;
      padding: 2rem;
    }
    .icon-wrapper {
      background-color: #588157;
      border-radius: 50%;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }
    .icon-wrapper i {
      font-size: 2.5rem;
      color: #f8f9fa;
    }
    .footer-text {
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrapper">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h3 class="mb-3 text-warning" style="color: #588157 !important;">Site Temporarily Unavailable</h3>
    <p class="text-muted mb-3">
      We’re currently experiencing some technical issues. Our team is working hard to restore full functionality as soon as possible.
    </p>
    <p class="text-secondary small mb-0">
      Thank you for your patience.
    </p>
    <div class="footer-text">
      &copy; <span id="year"></span> Ovenfresh
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
